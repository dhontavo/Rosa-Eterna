<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rosa Eterna</title>

  <style>
    :root {
      --bg: #050a14;
      --case: rgba(20, 40, 70, 0.4);
      --casebase: #4a1414;
      --pink-bright: #ff4d80;
      --pink-mid: #d52d58;
      --pink-dark: #8a1231;
      --green-stem: #055005;
      --scale: 1.2; 
    }

    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, #1a2a44 0%, #050a14 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      position: relative;
      transform: scale(var(--scale));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Cúpula */
    .glass {
      height: 450px;
      width: 250px;
      background: var(--case);
      border-radius: 300px 300px 15px 15px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
      z-index: 5;
      backdrop-filter: blur(1px);
    }

    .glass:after {
      content: "";
      position: absolute;
      height: 20px;
      width: 280px;
      background: var(--casebase);
      bottom: -15px;
      left: -15px;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }

    /* Tallo */
    .stem {
      position: absolute;
      width: 6px;
      height: 275px;
      background: linear-gradient(to bottom, #2d7a31, var(--green-stem));
      top: 135px;
      left: 122px;
      border-radius: 4px;
      z-index: 2;
    }

    .thorn {
      position: absolute;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
    }
    .t-left { border-right: 7px solid var(--green-stem); left: -7px; top: 100px; }
    .t-right { border-left: 7px solid var(--green-stem); left: 6px; top: 70px; }

    /* Rosa con Resplandor */
    .rose-head {
      position: absolute;
      top: 105px;
      left: 125px;
      z-index: 4;
    }

    .rose-glow {
      position: absolute;
      width: 100px;
      height: 100px;
      background: var(--pink-bright);
      filter: blur(45px);
      border-radius: 50%;
      left: -50px;
      top: -10px;
      opacity: 0.4;
      animation: breathe 4s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 0.5; }
    }

    .petal {
      position: absolute;
      background: var(--pink-mid);
      border-radius: 50% 50% 25% 25% / 80% 80% 20% 20%;
      box-shadow: inset 0 -15px 25px rgba(0,0,0,0.5), 0 5px 10px rgba(0,0,0,0.2);
      transform-origin: bottom center;
    }

    .p-core { width: 30px; height: 50px; left: -15px; background: var(--pink-bright); z-index: 20; border-radius: 50%; top: 10px; }
    .p1 { width: 45px; height: 70px; left: -22.5px; transform: rotate(0deg); z-index: 18; background: var(--pink-bright); }
    .p2 { width: 50px; height: 75px; left: -25px; transform: rotate(-15deg); z-index: 15; }
    .p3 { width: 50px; height: 75px; left: -25px; transform: rotate(15deg); z-index: 15; }
    .p4 { width: 55px; height: 80px; left: -27.5px; transform: rotate(-30deg); z-index: 12; background: var(--pink-mid); }
    .p5 { width: 55px; height: 80px; left: -27.5px; transform: rotate(30deg); z-index: 12; background: var(--pink-mid); }
    .p6 { width: 50px; height: 75px; left: -25px; transform: rotate(0deg) translateY(5px); z-index: 11; opacity: 0.9; }
    .p7 { width: 60px; height: 85px; left: -30px; transform: rotate(-45deg); z-index: 8; background: var(--pink-dark); }
    .p8 { width: 60px; height: 85px; left: -30px; transform: rotate(45deg); z-index: 8; background: var(--pink-dark); }
    .p9 { width: 65px; height: 90px; left: -32.5px; transform: rotate(0deg) translateY(8px); z-index: 7; background: var(--pink-dark); }

    .falling-petal {
      position: absolute;
      width: 30px;
      height: 22px;
      background: var(--pink-mid);
      border-radius: 0 80% 0 80%;
      top: 170px;
      left: 110px;
      opacity: 0;
      animation: fallInternal 8s infinite ease-in-out;
      z-index: 6;
      box-shadow: 0 0 15px var(--pink-bright);
    }

    @keyframes fallInternal {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      50% { transform: translate(45px, 140px) rotate(130deg); }
      80% { transform: translate(-25px, 240px) rotate(250deg); opacity: 0.5; }
      100% { transform: translate(0, 265px) rotate(320deg); opacity: 0; }
    }

    .dust {
      position: absolute;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px #fff;
      opacity: 0;
      animation: magic 6s infinite;
    }

    @keyframes magic {
      0%, 100% { opacity: 0; transform: translateY(0); }
      50% { opacity: 0.8; transform: translateY(-40px) translateX(15px); }
    }

    .leaf {
      position: absolute;
      width: 40px;
      height: 22px;
      background: var(--green-stem);
      border-radius: 0 100% 0 100%;
      box-shadow: inset 2px -2px 5px rgba(0,0,0,0.3);
    }
    .l1 { top: 245px; left: 85px; transform: rotate(-20deg); }
    .l2 { top: 205px; left: 123px; transform: rotate(190deg); }

    /* Estilo de la frase */
    .frase {
      margin-top: 50px;
      color: white;
      font-size: 1.5rem;
      font-style: italic;
      text-align: center;
      text-shadow: 0 0 10px var(--pink-bright), 0 0 20px var(--pink-dark);
      opacity: 0.9;
      letter-spacing: 1px;
    }

  </style>
</head>

<body>
  <div class="container">
    <div class="glass">
      
      <div class="stem">
        <div class="thorn t-left"></div>
        <div class="thorn t-right"></div>
      </div>

      <div class="leaf l1"></div>
      <div class="leaf l2"></div>

      <div class="rose-head">
        <div class="rose-glow"></div>
        <div class="petal p9"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p1"></div>
        <div class="petal p-core"></div>
      </div>

      <div class="falling-petal"></div>

      <div class="dust" style="top:25%; left:35%; width:2px; height:2px; animation-delay: 0s;"></div>
      <div class="dust" style="top:45%; left:75%; width:3px; height:3px; animation-delay: 1.5s;"></div>
      <div class="dust" style="top:65%; left:25%; width:2px; height:2px; animation-delay: 3s;"></div>
      <div class="dust" style="top:30%; left:60%; width:2px; height:2px; animation-delay: 4.5s;"></div>
    </div>
    
    <div class="frase">Eres la rosa que nunca se marchita</div>
  </div>

</body>
</html>
